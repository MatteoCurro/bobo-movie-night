plugins {
    id 'com.android.application'
}

android {
    namespace 'it.bobomovieclub.tvprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'it.bobomovieclub.tvprobe'
        minSdk 26
        targetSdk 32
        versionCode 10300
        versionName '1.3.0'
    }

    // Secrets are provided only by the protected release workflow.
    signingConfigs {
        boboRelease {
            def storePath = System.getenv('BOBO_TV_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('BOBO_TV_STORE_PASSWORD')
                keyAlias System.getenv('BOBO_TV_KEY_ALIAS')
                keyPassword System.getenv('BOBO_TV_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('BOBO_TV_KEYSTORE_PATH')) {
                signingConfig signingConfigs.boboRelease
            }
        }
    }

    lint {
        // TV app is distributed by signed sideload, not Google Play.
        // Keep targetSdk 32 for established Android TV / Fire OS behavior.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'androidx.core:core:1.13.1'
}
