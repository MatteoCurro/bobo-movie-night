plugins {
    id 'com.android.application'
}

android {
    namespace 'it.bobomovieclub.tvprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'it.bobomovieclub.tvprobe'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '0.1-tv-player-test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
