plugins {
    id 'com.android.application'
}

android {
    namespace 'it.bobomovieclub.tvprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'it.bobomovieclub.tvprobe'
        minSdk 26
        targetSdk 32
        versionCode 5
        versionName '1.1-tv-playback-fix'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
}
