<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151b">
<title>Bobo TV</title>
<!--TV_STYLES-->
<!-- Optional first-party TV theme; local CSS remains available offline. -->

</head>
<body>
<header class="topbar" id="topbar">
  <div class="logo" aria-label="Bobo Movie Club">BOBO<span>.</span><small>movie club</small></div>
  <nav id="tabs" aria-label="Navigazione principale">
    <button type="button" class="tab" data-view="home">Home</button>
    <button type="button" class="tab" data-view="movie">Film</button>
    <button type="button" class="tab" data-view="tv">Serie TV</button>
    <button type="button" class="tab" data-view="search">Cerca</button>
    <button type="button" class="tab" data-view="favorites">♥ Preferiti</button>
    <button type="button" class="tab" data-view="account">Account</button>
  </nav>
  <button id="tv-update-pill" class="tv-update-pill tv-focus" type="button" hidden>↑ Aggiorna</button>
  <div id="clock" class="top-hint" aria-hidden="true">TV · 1.3.1</div>
</header>
<main id="main" tabindex="-1"><div class="loading"><span class="spinner"></span><p>Caricamento catalogo Bobo…</p></div></main>
<div id="player" class="player" hidden>
  <iframe id="vixframe" title="Player Vix" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="origin" allowfullscreen></iframe>
  <div class="player-top"><span class="player-brand">BOBO<span>.</span></span><span id="playing-title"></span></div>
  <div id="player-start-guide" class="start-guide" hidden></div>
  <div id="player-hud" class="player-hud" aria-live="polite">
    <div class="player-hud-primary">
      <span id="play-symbol">▶</span>
      <strong id="play-hint">OK · Pausa / riprendi</strong>
      <span id="play-timestamp">—:—</span>
    </div>
    <div class="hud-progress"><div id="hud-progress-fill"></div></div>
    <div class="player-hud-guide"><span>◀ −10 s (tieni premuto per accelerare)</span><span>OK Pausa / Play</span><span>+10 s ▶</span><span>Indietro · Esci</span></div>
    <p id="player-note">Controlli dedicati alla TV. Se non disponibili, il player verrà riaperto al punto richiesto.</p>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<!--TV_SCRIPT-->
<!--TV_ACCOUNT_SCRIPT-->
<!--TV_UPDATES_SCRIPT-->
</body>
</html>
