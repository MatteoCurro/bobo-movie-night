<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="Cane da sheepdog che cammina lungo una cresta alpina">
 <title>Faiva sulla cresta</title>
 <style>
   .dogwalk{transform-origin:167px 145px;animation:walk 11s ease-in-out infinite}
   .wag{transform-origin:92px 143px;animation:wag 1.8s ease-in-out infinite}
   .frontpaw{transform-origin:196px 164px;animation:step .95s ease-in-out infinite alternate}
   .backpaw{transform-origin:123px 166px;animation:step 1.1s ease-in-out infinite alternate-reverse}
   .cloudlet{animation:drift 13s ease-in-out infinite alternate}
   @keyframes walk{0%,8%,100%{transform:translate(-24px,8px)}44%,57%{transform:translate(2px,-7px)}83%{transform:translate(19px,-15px)}}
   @keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
   @keyframes step{from{transform:rotate(-8deg)}to{transform:rotate(9deg)}}
   @keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(7px)}}
   @media(prefers-reduced-motion:reduce){.dogwalk,.wag,.frontpaw,.backpaw,.cloudlet{animation:none!important}}
 </style>
 <rect x="1.5" y="1.5" width="317" height="227" rx="16" fill="#10222d" fill-opacity=".93" stroke="#45616a" stroke-opacity=".7" stroke-width="2"/>
 <path d="M8 175 71 130 108 143 156 67 193 91 239 30 309 128V214H8Z" fill="#193947"/>
 <path d="m83 170 78-103 27 35 51-72 70 98" fill="none" stroke="#7aaeb0" stroke-width="2" stroke-linejoin="round"/>
 <path d="m216 65 23-35 25 41-22-9-15 11Z" fill="#b6dcd7" opacity=".9"/>
 <path d="m148 85 8-18 18 21-15-5Z" fill="#93c6c4" opacity=".8"/>
 <path d="M7 204 63 171 102 185 146 146 178 160 214 128 310 171" fill="none" stroke="#91b6b7" stroke-width="1.5" stroke-linejoin="round" opacity=".7"/>
 <g class="cloudlet" fill="none" stroke="#6f98a4" stroke-width="1.5" opacity=".9"><path d="M39 57h35m-26-8h32"/><path d="M257 98h29m-19-9h23"/></g>
 <g fill="#9ec7c3"><circle cx="48" cy="83" r="2"/><circle cx="271" cy="55" r="2"/><circle cx="289" cy="46" r="1.6"/></g>
 <!-- Four-legged herding dog with a real head/snout/ears/markings rather than lines. -->
