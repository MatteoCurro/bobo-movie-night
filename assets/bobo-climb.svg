<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="Piccolo arrampicatore che raggiunge una presa in palestra">
  <title>Bobo Beta 07 — un piccolo boulder</title>
  <style>
    .reacher{transform-origin:164px 133px;animation:step 10s ease-in-out infinite}
    .right-forearm{transform-origin:187px 106px;animation:reach 10s ease-in-out infinite}
    .spark{animation:blink 10s ease-in-out infinite}
    @keyframes step{0%,12%,100%{transform:translate(0px,7px) rotate(-2deg)}38%,52%{transform:translate(2px,-3px) rotate(1deg)}70%,83%{transform:translate(5px,-13px) rotate(2deg)}}
    @keyframes reach{0%,18%,100%{transform:rotate(8deg)}40%,70%{transform:rotate(-7deg)}}
    @keyframes blink{0%,33%,80%,100%{opacity:0}43%,69%{opacity:1}}
    @media(prefers-reduced-motion: reduce){.reacher,.right-forearm,.spark{animation:none!important}}
  </style>
