<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1116">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Preferiti · Bobo Movie Night</title>
  <meta name="description" content="I film e le serie TV che vuoi vedere, organizzati per profilo e genere.">
  <link rel="stylesheet" href="bobo-watch.css">
  <link rel="stylesheet" href="bobo-retro.css">
  <link rel="stylesheet" href="bobo-polish.css">
  <link rel="stylesheet" href="bobo-cloud.css">
  <link rel="stylesheet" href="bobo-favorites.css">
  <script defer src="bobo-friends.js"></script>
  <script defer src="bobo-library.js"></script>
  <script defer src="bobo-cloud.js"></script>
  <script defer src="bobo-favorites.js"></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html" aria-label="Bobo Movie Night — Home">Bobo Movie Night</a>
  <nav aria-label="Navigazione principale">
    <a href="index.html">Home</a>
    <a href="favorites.html" aria-current="page">Preferiti</a>
  </nav>
</header>
<main class="bobo-favorites-page">
  <div class="bobo-fav-heading">
    <span class="bobo-fav-eyebrow">BOBO / LA TUA RACCOLTA</span>
    <h1>Da vedere, prima o poi<span>.</span></h1>
    <p>Un posto solo per i tuoi film e le tue serie. Niente catalogo infinito.</p>
  </div>
  <section class="bobo-profile-bar" aria-labelledby="bobo-profile-title">
    <div>
      <label for="bobo-profile-picker" id="bobo-profile-title">Raccolta di</label>
      <div class="bobo-profile-picker-wrap">
        <select id="bobo-profile-picker" aria-label="Cambia profilo locale"></select>
        <button type="button" id="bobo-profile-new" class="bobo-compact-button">+ Nuovo nome</button>
      </div>
      <p>Ogni nome ha i suoi preferiti su questo browser. Per passarli a un altro dispositivo, usa «Condividi raccolta».</p>
    </div>
    <div class="bobo-backup-actions">
      <button type="button" id="bobo-export" class="bobo-compact-button">Esporta file</button>
      <button type="button" id="bobo-import" class="bobo-compact-button">Importa file</button>
      <button type="button" id="bobo-share" class="bobo-compact-button bobo-button-focus">Condividi raccolta</button>
      <button type="button" id="bobo-recover" class="bobo-compact-button">Recupera codice</button>
      <input id="bobo-import-file" type="file" accept="application/json,.json" hidden>
    </div>
  </section>
  <section class="bobo-fav-filters" aria-label="Filtra i tuoi preferiti">
    <div class="bobo-fav-filter"><label for="bobo-fav-type">Tipologia</label>
      <select id="bobo-fav-type">
        <option value="all">Film e serie</option><option value="movie">Solo film</option><option value="tv">Solo serie TV</option>
      </select></div>
    <div class="bobo-fav-filter"><label for="bobo-fav-genre">Genere</label><select id="bobo-fav-genre"><option value="all">Tutti i generi</option></select></div>
    <div class="bobo-fav-filter"><label for="bobo-fav-order">Ordina</label>
      <select id="bobo-fav-order"><option value="recent">Ultimi salvati</option><option value="title">Titolo A–Z</option><option value="year">Anno</option></select></div>
    <div class="bobo-fav-filter bobo-fav-search"><label for="bobo-fav-search">Cerca</label><input id="bobo-fav-search" placeholder="Tra i tuoi preferiti…" type="search"></div>
  </section>
  <div class="bobo-fav-summary" id="bobo-fav-summary" aria-live="polite"></div>
  <div class="bobo-fav-collections" id="bobo-fav-collections">
    <p class="bobo-fav-empty">Caricamento raccolta…</p>
  </div>
</main>
</body>
</html>
