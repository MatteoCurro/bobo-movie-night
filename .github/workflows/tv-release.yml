name: Bobo TV · Signed release

on:
  push:
    branches:
      - tv-features-1-2
    tags:
      - 'tv-v*'
    paths:
      - 'tv-test/**'
      - '.github/workflows/tv-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require stable signing secrets
        env:
          KEYSTORE: ${{ secrets.BOBO_TV_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.BOBO_TV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOBO_TV_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BOBO_TV_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Configure the four BOBO_TV_* signing secrets before publishing"
            exit 1
          fi
      - name: Validate TV version and syntax
        shell: bash
        run: |
          expected="tv-v$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" tv-test/app/build.gradle)"
          echo "BOBO_RELEASE_TAG=$expected" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "$expected" || {
              echo "::error::Tag does not match versionName: $expected"; exit 1;
            }
          fi
          node --check tv-test/app/src/main/assets/tv.js
          node --check tv-test/app/src/main/assets/tv-account.js
          node --check tv-test/app/src/main/assets/tv-updates.js
          php -l backend/htdocs/api.php
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare TV artwork
        run: |
          python -m pip install --quiet pillow
          mkdir -p tv-test/app/src/main/res/drawable-nodpi
          base64 --decode tv-test/app/src/main/assets/bobo-icon.jpg.base64 > tv-test/app/src/main/res/drawable-nodpi/bobo_icon.jpg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('tv-test/app/src/main/res/drawable-nodpi')
          src=Image.open(root/'bobo_icon.jpg').convert('RGB')
          src.load()
          canvas=Image.new('RGB',(320,180),(12,17,22))
          mark=src.crop((7,45,120,85))
          mark=mark.resize((282,100),Image.Resampling.LANCZOS)
          canvas.paste(mark,((320-mark.width)//2,(180-mark.height)//2))
          canvas.save(root/'bobo_tv_banner.png',optimize=True)
          PY
      - name: Decode protected signing keystore
        env:
          BOBO_TV_KEYSTORE_B64: ${{ secrets.BOBO_TV_KEYSTORE_B64 }}
        run: |
          printf '%s' "$BOBO_TV_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bobo-tv-signing.jks"
          chmod 600 "$RUNNER_TEMP/bobo-tv-signing.jks"
      - name: Compile signed release
        env:
          BOBO_TV_KEYSTORE_PATH: ${{ runner.temp }}/bobo-tv-signing.jks
          BOBO_TV_STORE_PASSWORD: ${{ secrets.BOBO_TV_STORE_PASSWORD }}
          BOBO_TV_KEY_ALIAS: ${{ secrets.BOBO_TV_KEY_ALIAS }}
          BOBO_TV_KEY_PASSWORD: ${{ secrets.BOBO_TV_KEY_PASSWORD }}
        run: gradle -p tv-test :app:assembleRelease --no-daemon
      - name: Verify APK package signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose tv-test/app/build/outputs/apk/release/app-release.apk
          cp tv-test/app/build/outputs/apk/release/app-release.apk Bobo-Movie-Club-TV.apk
          sha256sum Bobo-Movie-Club-TV.apk
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$BOBO_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $BOBO_RELEASE_TAG già pubblicata: nessuna duplicazione."
            exit 0
          fi
          gh release create "$BOBO_RELEASE_TAG" Bobo-Movie-Club-TV.apk \
            --target "$GITHUB_SHA" \
            --title "Bobo Movie Club TV $BOBO_RELEASE_TAG" \
            --notes "Aggiornamento TV: account persistente, preferiti più affidabili, nuova interfaccia e aggiornamenti nell'app."
