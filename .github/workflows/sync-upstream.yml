name: Sync upstream CasaFlix

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6,18 * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bobo-movie-night-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Bobo Movie Night
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Pull latest CasaFlix and apply branding
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch main https://github.com/scageto/CasaFlix.git /tmp/casaflix
          install -m 0644 /tmp/casaflix/index.html ./index.html
          mkdir -p data
          install -m 0644 /tmp/casaflix/data/movies.json ./data/movies.json
          install -m 0644 /tmp/casaflix/data/tv.json ./data/tv.json
          python3 - <<'PY'
          from pathlib import Path
          page = Path("index.html")
          content = page.read_text(encoding="utf-8-sig")
          if "<title>CasaFlix</title>" not in content or "🎬 CasaFlix</div>" not in content:
              raise SystemExit("Upstream branding changed; review required")
          content = content.replace("<title>CasaFlix</title>", "<title>Bobo Movie Night</title>")
          content = content.replace("🎬 CasaFlix</div>", "🎬 Bobo Movie Night</div>")
          page.write_text(content, encoding="utf-8")
          PY
          touch .nojekyll

      - name: Commit only if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/movies.json data/tv.json .nojekyll
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git commit -m "sync: refresh Bobo Movie Night from CasaFlix"
          git push

      - name: Prepare static site for deployment
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/movies.json data/tv.json _site/data/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Bobo Movie Night
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
