name: Bobo · Catalogo autonomo

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6,18 * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bobo-movie-night-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Bobo Movie Night
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Incrementally update the Bobo-owned catalog from TMDB
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN || secrets.TMDB_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_tmdb_catalog.py
          touch .nojekyll

      - name: Refresh streaming discovery (Italy)
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN || secrets.TMDB_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_discovery.py
          python3 scripts/build_streaming_feed.py
          python3 scripts/build_newsletter_digest.py
          python3 -m pip install --disable-pip-version-check 'Pillow>=11.0,<13.0'
          python3 scripts/vendor_flaticon.py
          python3 scripts/prepare_flaticon.py
          python3 scripts/build_catalog_ledger.py
          python3 scripts/build_poster_index.py

      - name: Validate Bobo enhancements
        shell: bash
        run: |
          node --check bobo-ui.js
          node --check bobo-watch.js
          node --check bobo-friends.js
          node --check bobo-library.js
          node --check bobo-enhance.js
          node --check bobo-cloud.js
          node --check bobo-favorites.js
          python3 -m py_compile scripts/build_catalog_ledger.py
          python3 -m py_compile scripts/sync_tmdb_catalog.py
          python3 tests/sync_tmdb_catalog.py
          test -s data/enrichment.json
          test -d data/episodes
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('data/episodes').glob('*.json'))
          assert files, 'Missing per-series episode data'
          for path in files:
              payload=json.loads(path.read_text(encoding='utf-8'))
              assert payload['schema']==1 and payload['type']=='tv'
              assert int(path.stem)==int(payload['tmdb_id'])
          PY
          python3 -m py_compile scripts/build_poster_index.py
          python3 -m py_compile scripts/build_newsletter_digest.py
          python3 -m py_compile scripts/prepare_flaticon.py
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for asset in ('assets/bobo-climb.svg','assets/bobo-faiva.svg'):
              ET.parse(asset)
              assert Path(asset).stat().st_size > 1000
          import json
          manifest = json.loads(Path('assets/flaticon/manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema'] == 1 and isinstance(manifest['icons'],list)
          from PIL import Image
          for asset in manifest['icons']:
              path=Path(asset['file'])
              assert path.is_file() and path.read_bytes()[:3] == b'GIF'
              with Image.open(path) as gif:
                  assert gif.info.get('transparency') is not None
                  assert gif.convert('RGBA').getpixel((0,0))[3] == 0
          PY
          node tests/autonext.cjs
          node tests/episode-cards.cjs
          node tests/library.cjs
          node tests/profiles.cjs
          python3 -m py_compile scripts/build_discovery.py
          python3 -m py_compile scripts/build_streaming_feed.py
          grep -q 'bobo-ui.js' index.html
          grep -q 'bobo-retro.css' index.html
          grep -q 'bobo-polish.css' index.html
          grep -q 'bobo-polish.css' watch.html
          test -s bobo-polish.css
          grep -q 'bobo-friends.js' index.html
          grep -q 'bobo-friends.js' watch.html
          grep -q 'bobo-library.js' index.html
          grep -q 'bobo-enhance.js' index.html
          grep -q 'bobo-library.js' watch.html
          grep -q 'bobo-enhance.js' watch.html
          grep -q 'bobo-cloud.js' index.html
          grep -q 'bobo-cloud.js' watch.html
          grep -q 'bobo-cloud.js' favorites.html
          grep -q 'bobo-favorites.js' favorites.html
          grep -q 'bobo-library.js' favorites.html
          test -s bobo-favorites.css
          test -s bobo-favorites.js
          grep -q 'bobo-retro.css' watch.html
          test -s bobo-retro.css
          test -s bobo-friends.js
          grep -q 'bobo-ui.css' index.html
          grep -q 'referrerpolicy="origin"' index.html
          grep -q 'referrerpolicy="origin"' watch.html
          grep -q 'bobo-watch.js' watch.html
          test -s watch.html
          test -s bobo-watch.css
          test -s bobo-watch.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('movies','tv'):
              data = json.loads(Path(f'data/{name}.json').read_text(encoding='utf-8'))
              assert data.get('items'), f'Empty catalog: {name}'
              for example in data['items'][:30]:
                  assert example.get('tmdb_id') and str(example.get('title') or '').strip(), f'Missing identity: {name}'
                  assert 'overview' not in example or isinstance(example['overview'], str), f'Invalid synopsis: {name}'
          posters=json.loads(Path('data/poster-index.json').read_text(encoding='utf-8'))
          assert posters['schema']==1
          assert all(isinstance(posters['items'][t],dict) for t in ('movie','tv'))
          assert sum(len(x) for x in posters['items'].values())>100
          overlay=json.loads(Path('data/enrichment.json').read_text(encoding='utf-8'))
          assert overlay['schema']==1 and isinstance(overlay['items'],dict)
          status=json.loads(Path('data/catalog-status.json').read_text(encoding='utf-8'))
          assert status['schema']==1
          discovery = json.loads(Path('data/discovery.json').read_text(encoding='utf-8'))
          assert discovery['schema'] == 1 and discovery['region'] == 'IT'
          assert isinstance(discovery['platforms'], list)
          digest=json.loads(Path('data/newsletter.json').read_text(encoding='utf-8'))
          assert digest['schema']==1 and digest['weekly'] or digest['platforms']
          PY

      - name: Commit only if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/movies.json data/tv.json data/discovery.json data/catalog-ledger.json data/poster-index.json data/enrichment.json data/episodes/ data/catalog-status.json data/newsletter.json assets/flaticon/ .nojekyll
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git commit -m "sync: refresh Bobo-owned catalog and metadata"
          # The catalog and Pages UI may be updated concurrently. Retry only
          # ordinary fast-forward pushes, never force-push or overwrite history.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Could not fast-forward generated files after four attempts" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Prepare static site for deployment
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/movies.json data/tv.json data/discovery.json data/catalog-ledger.json data/poster-index.json data/enrichment.json data/catalog-status.json data/newsletter.json _site/data/
          cp -R data/episodes _site/data/
          test -d _site/data/episodes
          test -s _site/data/enrichment.json
          test -s _site/data/catalog-status.json
          cp bobo-ui.css bobo-ui.js bobo-retro.css bobo-polish.css bobo-friends.js bobo-library.js bobo-cloud.css bobo-cloud.js bobo-enhance.js _site/
          mkdir -p _site/assets
          cp -R assets/flaticon _site/assets/
          cp watch.html bobo-watch.js bobo-watch.css _site/
          cp favorites.html bobo-favorites.js bobo-favorites.css _site/
          touch _site/.nojekyll

      - name: Package site for private Gandi hosting
        uses: actions/upload-artifact@v4
        with:
          name: bobo-gandi-static
          path: _site/
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Bobo Movie Night
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
