name: Sync upstream CasaFlix

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6,18 * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bobo-movie-night-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Bobo Movie Night
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Pull latest CasaFlix and apply branding
        shell: bash
        run: |
          set -euo pipefail
          if git clone --quiet --depth=1 --branch main https://github.com/scageto/CasaFlix.git /tmp/casaflix; then
            install -m 0644 /tmp/casaflix/index.html ./index.html
            mkdir -p data
            install -m 0644 /tmp/casaflix/data/movies.json ./data/movies.json
            install -m 0644 /tmp/casaflix/data/tv.json ./data/tv.json
            python3 - <<'PY'
          from pathlib import Path
          page = Path("index.html")
          content = page.read_text(encoding="utf-8-sig")
          if "<title>CasaFlix</title>" not in content or "🎬 CasaFlix</div>" not in content:
              raise SystemExit("Upstream branding changed; review required")
          content = content.replace("<title>CasaFlix</title>", "<title>Bobo Movie Night</title>")
          content = content.replace("🎬 CasaFlix</div>", "🎬 Bobo Movie Night</div>")
          # The previous `cf_provider` preference is intentionally left untouched.
          # Use a new preference key so existing Vix selections don't force a blocked default.
          old_provider = """let provider   = ['vix','vidsrc'].includes(localStorage.getItem('cf_provider'))
            ? localStorage.getItem('cf_provider') : 'vix';"""
          new_provider = """let provider   = ['vix','vidsrc'].includes(localStorage.getItem('bobo_provider_v3'))
            ? localStorage.getItem('bobo_provider_v3') : 'vix';"""
          if old_provider not in content:
              raise SystemExit("Upstream provider preference changed; review required")
          content = content.replace(old_provider, new_provider)
          content = content.replace("localStorage.setItem('cf_provider', p)", "localStorage.setItem('bobo_provider_v3', p)")
          # Vix explicitly rejects embeds that suppress the origin Referer.
          if 'referrerpolicy="no-referrer"' not in content:
              raise SystemExit("Upstream iframe referrer policy changed; review required")
          content = content.replace('referrerpolicy="no-referrer"', 'referrerpolicy="origin"')
          help_button = '<button class="btn btn-primary" onclick="openInNewTab()" type="button">↗ Apri in nuova scheda</button>'
          if help_button not in content:
              raise SystemExit("Upstream player controls changed; review required")
          content = content.replace(help_button + '\n    </div>', help_button + '\n    </div>\n    <p class="player-help">Se il player mostra un blocco di sicurezza o non parte, usa <b>Cambia provider</b> oppure <b>Apri in nuova scheda</b>. Il browser non può verificare automaticamente gli errori mostrati dentro un iframe esterno.</p>')
          content = content.replace('</style>', '  .player-help { color: #bbb; font-size: 12px; padding: 0 16px 14px; line-height: 1.45; }\n  </style>')
          # Navigation initiated by the site must not send the site's Referer.
          direct_open = "window.open(playerURL(playerState.currentProv, playerState), '_blank');"
          if direct_open not in content:
              raise SystemExit("Upstream direct-open handler changed; review required")
          content = content.replace(direct_open, "window.open(playerURL(playerState.currentProv, playerState), '_blank', 'noopener,noreferrer');")
          player_button = '<button class="btn btn-primary" onclick="openInNewTab()" type="button">↗ Apri in nuova scheda</button>'
          content = content.replace(player_button, player_button + '\n      <button class="btn btn-ghost" onclick="copyPlayerLink()" type="button">⧉ Copia link</button>')
          copy_handler = """async function copyPlayerLink() {
            if (!playerState) return;
            const url = playerURL(playerState.currentProv, playerState);
            try {
              await navigator.clipboard.writeText(url);
              alert('Link copiato. Incollalo direttamente nella barra degli indirizzi del browser per verificare il blocco.');
            } catch (err) {
              window.prompt('Copia questo URL e incollalo nella barra degli indirizzi:', url);
            }
          }
          """
          content = content.replace("function openInNewTab() {", copy_handler + "\nfunction openInNewTab() {")
          # Keep Bobo-specific UI separate so upstream refreshes cannot erase it.
          if "</head>" not in content or "</body>" not in content:
              raise SystemExit("Upstream HTML layout changed; review required")
          # Avoid sharing the site address with external services by default;
          # the Vix iframe explicitly overrides this with its required 'origin' policy.
          content = content.replace("</head>", '  <meta name="referrer" content="no-referrer">\n</head>', 1)
          # While GitHub Pages is public, avoid normal search-engine indexing.
          # This is NOT authentication; the Gandi password gate is still required.
          content = content.replace("</head>", '  <meta name="robots" content="noindex,nofollow,noarchive">\n</head>', 1)
          content = content.replace("</head>", '  <link rel="stylesheet" href="bobo-ui.css">\n</head>', 1)
          content = content.replace("</head>", '  <link rel="stylesheet" href="bobo-retro.css">\n</head>', 1)
          content = content.replace("</head>", '  <link rel="stylesheet" href="bobo-polish.css">\n</head>', 1)
          content = content.replace("</head>", '  <link rel="stylesheet" href="bobo-cloud.css">\n</head>', 1)
          content = content.replace("</head>", '  <script defer src="bobo-friends.js"></script>\n</head>', 1)
          content = content.replace("</body>", '  <script defer src="bobo-library.js"></script>\n  <script defer src="bobo-cloud.js"></script>\n  <script defer src="bobo-ui.js"></script>\n  <script defer src="bobo-enhance.js"></script>\n</body>', 1)
          page.write_text(content, encoding="utf-8")
          PY
          else
            echo "::warning::CasaFlix upstream unavailable. Keep last validated Bobo catalog and continue deployment."
            test -s index.html
            test -s data/movies.json
            test -s data/tv.json
          fi
          touch .nojekyll

      - name: Refresh streaming discovery (Italy)
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN || secrets.TMDB_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_discovery.py
          python3 scripts/build_streaming_feed.py
          python3 scripts/build_newsletter_digest.py
          python3 -m pip install --disable-pip-version-check 'Pillow>=11.0,<13.0'
          python3 scripts/vendor_flaticon.py
          python3 scripts/prepare_flaticon.py
          python3 scripts/build_catalog_ledger.py
          python3 scripts/build_poster_index.py

      - name: Validate Bobo enhancements
        shell: bash
        run: |
          node --check bobo-ui.js
          node --check bobo-watch.js
          node --check bobo-friends.js
          node --check bobo-library.js
          node --check bobo-enhance.js
          node --check bobo-cloud.js
          node --check bobo-favorites.js
          python3 -m py_compile scripts/build_catalog_ledger.py
          python3 -m py_compile scripts/build_poster_index.py
          python3 -m py_compile scripts/build_newsletter_digest.py
          python3 -m py_compile scripts/prepare_flaticon.py
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for asset in ('assets/bobo-climb.svg','assets/bobo-faiva.svg'):
              ET.parse(asset)
              assert Path(asset).stat().st_size > 1000
          import json
          manifest = json.loads(Path('assets/flaticon/manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema'] == 1 and isinstance(manifest['icons'],list)
          from PIL import Image
          for asset in manifest['icons']:
              path=Path(asset['file'])
              assert path.is_file() and path.read_bytes()[:3] == b'GIF'
              with Image.open(path) as gif:
                  assert gif.info.get('transparency') is not None
                  assert gif.convert('RGBA').getpixel((0,0))[3] == 0
          PY
          node tests/autonext.cjs
          node tests/library.cjs
          node tests/profiles.cjs
          python3 -m py_compile scripts/build_discovery.py
          python3 -m py_compile scripts/build_streaming_feed.py
          grep -q 'bobo-ui.js' index.html
          grep -q 'bobo-retro.css' index.html
          grep -q 'bobo-polish.css' index.html
          grep -q 'bobo-polish.css' watch.html
          test -s bobo-polish.css
          grep -q 'bobo-friends.js' index.html
          grep -q 'bobo-friends.js' watch.html
          grep -q 'bobo-library.js' index.html
          grep -q 'bobo-enhance.js' index.html
          grep -q 'bobo-library.js' watch.html
          grep -q 'bobo-enhance.js' watch.html
          grep -q 'bobo-cloud.js' index.html
          grep -q 'bobo-cloud.js' watch.html
          grep -q 'bobo-cloud.js' favorites.html
          grep -q 'bobo-favorites.js' favorites.html
          grep -q 'bobo-library.js' favorites.html
          test -s bobo-favorites.css
          test -s bobo-favorites.js
          grep -q 'bobo-retro.css' watch.html
          test -s bobo-retro.css
          test -s bobo-friends.js
          grep -q 'bobo-ui.css' index.html
          grep -q 'referrerpolicy="origin"' index.html
          grep -q 'referrerpolicy="origin"' watch.html
          grep -q 'bobo-watch.js' watch.html
          test -s watch.html
          test -s bobo-watch.css
          test -s bobo-watch.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('movies','tv'):
              data = json.loads(Path(f'data/{name}.json').read_text(encoding='utf-8'))
              assert data.get('items'), f'Empty catalog: {name}'
              example = data['items'][0]
              assert 'tmdb_id' in example and 'overview' in example, f'Missing metadata: {name}'
          posters=json.loads(Path('data/poster-index.json').read_text(encoding='utf-8'))
          assert posters['schema']==1
          assert all(isinstance(posters['items'][t],dict) for t in ('movie','tv'))
          assert sum(len(x) for x in posters['items'].values())>100
          discovery = json.loads(Path('data/discovery.json').read_text(encoding='utf-8'))
          assert discovery['schema'] == 1 and discovery['region'] == 'IT'
          assert isinstance(discovery['platforms'], list)
          digest=json.loads(Path('data/newsletter.json').read_text(encoding='utf-8'))
          assert digest['schema']==1 and digest['weekly'] or digest['platforms']
          PY

      - name: Commit only if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/movies.json data/tv.json data/discovery.json data/catalog-ledger.json data/poster-index.json data/newsletter.json assets/flaticon/ .nojekyll
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git commit -m "sync: refresh Bobo Movie Night from CasaFlix"
          # The catalog and Pages UI may be updated concurrently. Retry only
          # ordinary fast-forward pushes, never force-push or overwrite history.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Could not fast-forward generated files after four attempts" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Prepare static site for deployment
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/movies.json data/tv.json data/discovery.json data/catalog-ledger.json data/poster-index.json data/newsletter.json _site/data/
          cp bobo-ui.css bobo-ui.js bobo-retro.css bobo-polish.css bobo-friends.js bobo-library.js bobo-cloud.css bobo-cloud.js bobo-enhance.js _site/
          mkdir -p _site/assets
          cp -R assets/flaticon _site/assets/
          cp watch.html bobo-watch.js bobo-watch.css _site/
          cp favorites.html bobo-favorites.js bobo-favorites.css _site/
          touch _site/.nojekyll

      - name: Package site for private Gandi hosting
        uses: actions/upload-artifact@v4
        with:
          name: bobo-gandi-static
          path: _site/
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Bobo Movie Night
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
