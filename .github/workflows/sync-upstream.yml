name: Bobo · Catalogo autonomo

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6,14,22 * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bobo-movie-night-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Bobo Movie Night
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Incrementally update the Bobo-owned catalog from TMDB
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN || secrets.TMDB_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_tmdb_catalog.py
          touch .nojekyll

      - name: Refresh streaming discovery (Italy)
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN || secrets.TMDB_API_KEY }}
          AMODB_KEY: ${{ secrets.AMODB_KEY }}
          BOBO_CREDITS_BATCH: '160'
          BOBO_PEOPLE_BATCH: '36'
          BOBO_AWARDS_BATCH: '40'
          BOBO_IMDB_BATCH: '280'
          BOBO_IMDB_YEAR_BATCH: '3'
          BOBO_OSCAR_CURRENT_BATCH: '140'
          BOBO_QUOTE_SOURCES_BATCH: '180'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_discovery.py
          python3 scripts/build_streaming_feed.py
          python3 scripts/build_editorial.py
          python3 scripts/build_newsletter_digest.py
          python3 -m pip install --disable-pip-version-check 'Pillow>=11.0,<13.0'
          python3 scripts/vendor_flaticon.py
          python3 scripts/prepare_flaticon.py
          python3 scripts/build_catalog_ledger.py
          python3 scripts/build_reviews.py
          python3 scripts/build_critic_links.py
          python3 scripts/build_multi_ratings.py
          python3 scripts/build_cinema.py
          python3 scripts/backfill_cinema_portraits.py
          python3 scripts/discover_quote_sources.py
          python3 scripts/build_person_search.py
          python3 scripts/localize_cinema_people.py
          python3 scripts/build_oscar_backfill.py
          python3 scripts/build_oscar_current.py
          python3 scripts/import_imdb_metadata.py
          python3 scripts/build_thematic_index.py
          python3 scripts/build_related_index.py
          python3 scripts/build_cinema_explore.py
          python3 scripts/build_story_connections.py
          python3 scripts/enrich_person_facts.py
          python3 scripts/build_catalog_metrics.py
          python3 scripts/build_poster_index.py

      - name: Validate Bobo enhancements
        shell: bash
        run: |
          node --check bobo-ui.js
          node --check bobo-players.js
          node --check bobo-watch.js
          node --check bobo-cinema.js
          node tests/watch-dossier.cjs
          node --check bobo-related.js
          node --check bobo-discover.js
          node --check bobo-awards.js
          node tests/player-manager.cjs
          node --check bobo-reviews.js
          node tests/platform-labels.cjs
          node tests/verified-audio.cjs
          node tests/index-inline.cjs
          node tests/home-curation.cjs
          node --check bobo-friends.js
          node --check bobo-library.js
          node --check bobo-enhance.js
          node --check bobo-cloud.js
          node --check bobo-favorites.js
          python3 -m py_compile scripts/build_catalog_ledger.py scripts/build_reviews.py scripts/build_catalog_metrics.py scripts/build_related_index.py scripts/build_critic_links.py scripts/build_multi_ratings.py
          python3 -m py_compile scripts/sync_tmdb_catalog.py
          python3 tests/sync_tmdb_catalog.py
          python3 tests/platform-anime.py
          python3 tests/archive-metrics.py
          python3 tests/review-catalog-backfill.py
          python3 tests/related-index.py
          python3 -m py_compile scripts/build_thematic_index.py
          python3 tests/thematic-index.py
          python3 -m py_compile scripts/build_cinema.py
          python3 tests/cinema.py
          python3 -m py_compile scripts/backfill_cinema_portraits.py scripts/discover_quote_sources.py
          python3 tests/portrait-backfill.py
          python3 tests/quote-sources.py
          python3 -m py_compile scripts/build_person_search.py
          python3 tests/person-search.py
          python3 -m py_compile scripts/build_cinema_explore.py scripts/enrich_person_facts.py
          python3 tests/cinema-explore.py
          python3 -m py_compile scripts/build_story_connections.py
          python3 tests/story-connections.py
          python3 -m py_compile scripts/localize_cinema_people.py
          python3 tests/person-localization.py
          python3 -m py_compile scripts/build_oscar_backfill.py
          python3 tests/oscar.py
          python3 -m py_compile scripts/build_oscar_current.py scripts/import_imdb_metadata.py
          python3 tests/oscar-current.py
          python3 tests/imdb-metadata.py
          python3 tests/critic-links.py
          python3 tests/multi-ratings.py
          test -s data/cinema/person-search.json
          test -s data/cinema/explore.json
          test -s data/cinema/film-quotes.json
          test -s data/cinema/theme-index.json
          test -s data/seasonal.json
          test -s data/cinema/quote-sources.json
          test -s data/cinema/portrait-status.json
          test -s data/cinema/connections-status.json
          test -s data/enrichment.json
          test -d data/episodes
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('data/episodes').glob('*.json'))
          assert files, 'Missing per-series episode data'
          for path in files:
              payload=json.loads(path.read_text(encoding='utf-8'))
              assert payload['schema']==1 and payload['type']=='tv'
              assert int(path.stem)==int(payload['tmdb_id'])
          PY
          python3 -m py_compile scripts/build_poster_index.py
          python3 -m py_compile scripts/build_editorial.py
          python3 -m py_compile scripts/build_newsletter_digest.py
          python3 -m py_compile scripts/prepare_flaticon.py
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for asset in ('assets/bobo-climb.svg','assets/bobo-faiva.svg'):
              ET.parse(asset)
              assert Path(asset).stat().st_size > 1000
          import json
          manifest = json.loads(Path('assets/flaticon/manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema'] == 1 and isinstance(manifest['icons'],list)
          from PIL import Image
          for asset in manifest['icons']:
              path=Path(asset['file'])
              assert path.is_file() and path.read_bytes()[:3] == b'GIF'
              with Image.open(path) as gif:
                  assert gif.info.get('transparency') is not None
                  assert gif.convert('RGBA').getpixel((0,0))[3] == 0
          PY
          node tests/autonext.cjs
          node tests/episode-cards.cjs
          node tests/catalog-hover.cjs
          node tests/discover-integration.cjs
          node tests/hero-images.cjs
          node tests/library.cjs
          node tests/profiles.cjs
          python3 -m py_compile scripts/build_discovery.py
          python3 -m py_compile scripts/build_streaming_feed.py
          grep -q 'bobo-ui.js' index.html
          grep -q 'bobo-retro.css' index.html
          grep -q 'bobo-polish.css' index.html
          grep -q 'bobo-polish.css' watch.html
          test -s bobo-polish.css
          grep -q 'bobo-friends.js' index.html
          grep -q 'bobo-friends.js' watch.html
          grep -q 'bobo-library.js' index.html
          grep -q 'bobo-enhance.js' index.html
          grep -q 'bobo-library.js' watch.html
          grep -q 'bobo-enhance.js' watch.html
          grep -q 'bobo-cloud.js' index.html
          grep -q 'bobo-cloud.js' watch.html
          grep -q 'bobo-cloud.js' favorites.html
          grep -q 'bobo-favorites.js' favorites.html
          grep -q 'bobo-library.js' favorites.html
          test -s bobo-favorites.css
          test -s bobo-favorites.js
          grep -q 'bobo-retro.css' watch.html
          test -s bobo-retro.css
          test -s bobo-friends.js
          grep -q 'bobo-ui.css' index.html
          grep -q 'referrerpolicy="origin"' index.html
          grep -q 'referrerpolicy="origin"' watch.html
          grep -q 'bobo-watch.js' watch.html
          test -s watch.html
          test -s bobo-watch.css
          test -s bobo-watch.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('movies','tv'):
              data = json.loads(Path(f'data/{name}.json').read_text(encoding='utf-8'))
              assert data.get('items'), f'Empty catalog: {name}'
              for example in data['items'][:30]:
                  assert example.get('tmdb_id') and str(example.get('title') or '').strip(), f'Missing identity: {name}'
                  assert 'overview' not in example or isinstance(example['overview'], str), f'Invalid synopsis: {name}'
          posters=json.loads(Path('data/poster-index.json').read_text(encoding='utf-8'))
          assert posters['schema']==1
          assert all(isinstance(posters['items'][t],dict) for t in ('movie','tv'))
          assert sum(len(x) for x in posters['items'].values())>100
          overlay=json.loads(Path('data/enrichment.json').read_text(encoding='utf-8'))
          assert overlay['schema']==1 and isinstance(overlay['items'],dict)
          status=json.loads(Path('data/catalog-status.json').read_text(encoding='utf-8'))
          assert status['schema']==1
          discovery = json.loads(Path('data/discovery.json').read_text(encoding='utf-8'))
          assert discovery['schema'] == 1 and discovery['region'] == 'IT'
          assert isinstance(discovery['platforms'], list)
          digest=json.loads(Path('data/newsletter.json').read_text(encoding='utf-8'))
          assert digest['schema']==1 and (digest['weekly'] or digest['platforms'])
          editorial=json.loads(Path('data/editorial.json').read_text(encoding='utf-8'))
          history=json.loads(Path('data/editorial-history.json').read_text(encoding='utf-8'))
          assert editorial['schema']==1 and len(editorial['sections'])>=3
          assert all(i.get('vote_count',0)>=200 for s in editorial['sections'] for i in s['items'])
          evidence=json.loads(Path('data/editorial-evidence.json').read_text(encoding='utf-8'))
          assert evidence['schema']==1 and len(evidence['titles'])>=100
          assert history['schema']==1 and history['titles']
          assert all(x['type']!='tv' or int(x['year'])>=2010 for x in digest['weekly'])
          assert len(digest['weekly']) + sum(len(x['items']) for x in digest.get('sections',[]))<=7
          PY

      - name: Commit only if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/cinema/ data/seasonal.json data/related/ data/catalog-metrics.json data/reviews.json data/critic-reviews.json data/multi-ratings.json data/editorial.json data/editorial-history.json data/editorial-evidence.json data/movies.json data/tv.json data/discovery.json data/catalog-ledger.json data/poster-index.json data/enrichment.json data/episodes/ data/catalog-status.json data/newsletter.json assets/flaticon/ .nojekyll
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git commit -m "sync: refresh Bobo-owned catalog and metadata"
          # The catalog and Pages UI may be updated concurrently. Retry only
          # ordinary fast-forward pushes, never force-push or overwrite history.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Could not fast-forward generated files after four attempts" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Prepare static site for deployment
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          # Only browser dependencies + the public newsletter digest.
          # Never copy repository roots, backend, build scripts or runtime state.
          cp data/movies.json data/tv.json data/editorial.json data/discovery.json data/seasonal.json data/catalog-ledger.json data/poster-index.json data/enrichment.json data/newsletter.json data/player-sources.json data/verified-audio.json data/reviews.json data/critic-reviews.json data/multi-ratings.json _site/data/
          cp -R data/episodes _site/data/
          mkdir -p _site/data/related
          find data/related -maxdepth 1 -type f -name '[0-3][0-9a-f].json' -exec cp {} _site/data/related/ \;
          mkdir -p _site/data/cinema/credits _site/data/cinema/people _site/data/cinema/connections
          cp data/cinema/person-search.json data/cinema/explore.json data/cinema/film-quotes.json data/cinema/OSCAR-LICENSE.txt data/cinema/OSCAR-CURRENT-LICENSE.txt _site/data/cinema/
          for kind in credits people connections; do
            find "data/cinema/$kind" -maxdepth 1 -type f -name '*.json' -exec cp {} "_site/data/cinema/$kind/" \;
          done
          test -s _site/data/cinema/person-search.json
          test -s _site/data/cinema/film-quotes.json
          test -d _site/data/cinema/credits && test -d _site/data/cinema/people && test -d _site/data/cinema/connections
          test -d _site/data/episodes
          test -s _site/data/enrichment.json
          test -s _site/data/seasonal.json
          cp discover.html bobo-discover.css bobo-discover.js awards.html bobo-awards.css bobo-awards.js informazioni.html _site/
          test -s _site/awards.html && test -s _site/bobo-awards.js && test -s _site/informazioni.html
          cp bobo-ui.css bobo-ui.js bobo-retro.css bobo-polish.css bobo-friends.js bobo-library.js bobo-cloud.css bobo-cloud.js bobo-enhance.js _site/
          mkdir -p _site/assets
          cp -R assets/flaticon _site/assets/
          cp watch.html bobo-watch.js bobo-watch.css bobo-players.js bobo-related.js bobo-official-audio.js bobo-reviews.js bobo-critic.js bobo-multi-ratings.js _site/
          cp person.html director.html bobo-cinema.js bobo-cinema.css _site/
          test -s _site/director.html && test -s _site/data/cinema/explore.json
          test -s _site/person.html && test -s _site/bobo-cinema.js && test -s _site/bobo-cinema.css
          test -s _site/bobo-players.js && test -s _site/data/player-sources.json
          cp favorites.html bobo-favorites.js bobo-favorites.css _site/
          # The TV installation page is a separate directory; it must be part
          # of the deployed _site artifact, not merely present in GitHub.
          mkdir -p _site/tv
          cp tv/index.html _site/tv/index.html
          test -s _site/tv/index.html
          touch _site/.nojekyll

      - name: Audit tracked files and public release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_distribution.py --repo --dist _site

      - name: Package site for private Gandi hosting
        uses: actions/upload-artifact@v4
        with:
          name: bobo-gandi-static
          path: _site/
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Bobo Movie Night
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
