name: Bobo TV · Player test APK

on:
  push:
    branches:
      - tv-player-probe
    paths:
      - 'tv-test/**'
      - '.github/workflows/tv-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK
        run: gradle -p tv-test :app:assembleDebug --stacktrace --no-daemon
      - name: Publish test APK
        uses: actions/upload-artifact@v4
        with:
          name: Bobo-Movie-Club-TV-test-APK
          path: tv-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
