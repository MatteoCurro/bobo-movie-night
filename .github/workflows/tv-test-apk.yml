name: Bobo TV · 1.3.x test

on:
  push:
    branches:
      - tv-features-1-2
      - feature/tv-1-3-stable-session-updates
      - feature/tv-1-3-1-visual-refresh
      - fix/tv-1-3-2-remote-navigation
    paths:
      - 'tv-test/**'
      - '.github/workflows/tv-test-apk.yml'
  workflow_dispatch:

concurrency:
  group: tv-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate TV navigation JavaScript
        run: |
          node --check tv-test/app/src/main/assets/tv.js
          node --check tv-test/app/src/main/assets/vix-bridge.js
          node --check tv-test/app/src/main/assets/tv-account.js
          node --check tv-test/app/src/main/assets/tv-updates.js
          php -l backend/htdocs/api.php
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare TV launcher icon and banner
        run: |
          python -m pip install --quiet pillow
          mkdir -p tv-test/app/src/main/res/drawable-nodpi
          base64 --decode tv-test/app/src/main/assets/bobo-icon.jpg.base64 > tv-test/app/src/main/res/drawable-nodpi/bobo_icon.jpg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('tv-test/app/src/main/res/drawable-nodpi')
          src=Image.open(root/'bobo_icon.jpg').convert('RGB')
          src.load()
          canvas=Image.new('RGB',(320,180),(12,17,22))
          mark=src.crop((7,45,120,85))
          mark.thumbnail((282,108),Image.Resampling.LANCZOS)
          mark=mark.resize((282,100),Image.Resampling.LANCZOS)
          canvas.paste(mark,((320-mark.width)//2,(180-mark.height)//2))
          canvas.save(root/'bobo_tv_banner.png',optimize=True)
          print('Launcher icon and TV banner validated:',src.size)
          PY
      - name: Compile debug APK
        run: gradle -p tv-test :app:assembleDebug --stacktrace --no-daemon
      - name: Publish test APK
        uses: actions/upload-artifact@v4
        with:
          name: Bobo-Movie-Club-TV-debug-APK
          path: tv-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
