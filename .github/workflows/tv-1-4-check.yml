name: Bobo TV 1.4 · Validation

on:
  push:
    branches:
      - feature/tv-1-4-lightweight-cinema-20261126
    paths:
      - 'tv-test/**'
      - 'scripts/build_tv_payload.py'
      - 'tests/tv-payload.py'
      - '.github/workflows/tv-1-4-check.yml'
      - '.github/workflows/sync-upstream.yml'
      - 'scripts/audit_distribution.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate TV catalog generator
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_tv_payload.py
          python3 tests/tv-payload.py
          python3 scripts/build_tv_payload.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          home=json.loads(Path('data/tv-home.json').read_text())
          lite=json.loads(Path('data/tv-lite.json').read_text())
          assert home['schema']==1 and len(home['sections'])>=4
          assert len(lite['items'])>=10000
          assert Path('data/tv-home.json').stat().st_size < 150000
          assert Path('data/tv-lite.json').stat().st_size < 3500000
          assert len(list(Path('data/tv-detail').glob('*.json')))==64
          print('TV startup payload sizes:',Path('data/tv-home.json').stat().st_size,Path('data/tv-lite.json').stat().st_size)
          PY
      - name: Run TV JavaScript and remote-control regressions
        run: |
          node --check tv-test/app/src/main/assets/tv.js
          node --check tv-test/app/src/main/assets/tv-account.js
          node --check tv-test/app/src/main/assets/tv-updates.js
          node tv-test/tests/navigation.cjs
      - name: Build Android TV debug smoke APK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare TV artwork and compile
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p tv-test/app/src/main/res/drawable-nodpi
          base64 --decode tv-test/app/src/main/assets/bobo-icon.jpg.base64 > tv-test/app/src/main/res/drawable-nodpi/bobo_icon.jpg
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('tv-test/app/src/main/res/drawable-nodpi')
          src=Image.open(root/'bobo_icon.jpg').convert('RGB')
          canvas=Image.new('RGB',(320,180),(12,17,22))
          mark=src.crop((7,45,120,85)).resize((282,100),Image.Resampling.LANCZOS)
          canvas.paste(mark,((320-mark.width)//2,(180-mark.height)//2))
          canvas.save(root/'bobo_tv_banner.png')
          PY
          gradle -p tv-test :app:assembleDebug --no-daemon
      - name: Publish preview APK (debug signature: NOT an in-place upgrade)
        uses: actions/upload-artifact@v4
        with:
          name: bobo-tv-1-4-debug-smoke-test
          path: tv-test/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
