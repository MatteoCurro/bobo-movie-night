name: Bobo · Test sorgenti
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test catalog update and source overlays
        run: |
          python3 -m py_compile scripts/sync_tmdb_catalog.py scripts/build_discovery.py scripts/build_poster_index.py
          python3 tests/sync_tmdb_catalog.py
          python3 tests/platform-anime.py
          python3 tests/related-index.py
          python3 tests/critic-links.py
          python3 tests/multi-ratings.py
          python3 tests/archive-metrics.py
          python3 tests/incremental_catalog.py
      - name: Validate TV incremental architecture and browse filters
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_tv_payload.py
          python3 tests/tv-payload.py
          python3 scripts/build_tv_payload.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          home=json.loads(Path('data/tv-home.json').read_text())
          lite=json.loads(Path('data/tv-lite.json').read_text())
          assert home['schema']==1 and len(home['sections'])>=4
          assert len(lite['items'])>=10000
          assert Path('data/tv-home.json').stat().st_size < 150000
          assert Path('data/tv-lite.json').stat().st_size < 3500000
          assert len(list(Path('data/tv-detail').glob('*.json')))==64
          print('TV payload sizes:',Path('data/tv-home.json').stat().st_size,Path('data/tv-lite.json').stat().st_size)
          PY
          node --check tv-test/app/src/main/assets/tv.js
          node --check tv-test/app/src/main/assets/tv-account.js
          node --check tv-test/app/src/main/assets/tv-updates.js
          node tv-test/tests/navigation.cjs
          node tv-test/tests/browse.cjs
      - name: Validate site scripts
        run: |
          node --check bobo-players.js
          node --check bobo-watch.js
          node --check bobo-critic.js
          node --check bobo-multi-ratings.js
          node --check bobo-related.js
          node tests/player-manager.cjs
          node --check bobo-reviews.js
          node tests/platform-labels.cjs
          node tests/verified-audio.cjs
          node tests/index-inline.cjs
          node --check bobo-cloud.js
          node --check bobo-library.js
          node --check bobo-favorites.js
          node --check bobo-friends.js
          node tests/autonext.cjs
          node tests/episode-cards.cjs
          node tests/catalog-hover.cjs
          node tests/hero-images.cjs
          node tests/library.cjs
      - name: Audit repository and static allowlist
        run: |
          python3 tests/audit-distribution.py
      - name: Validate backend PHP
        run: |
          for f in backend/htdocs/*.php backend/lib/*.php backend/bin/*.php; do php -l "$f"; done
      - name: Check no external upstream dependency
        run: |
          ! grep -Eq 'git clone.+CasaFlix' .github/workflows/sync-upstream.yml
          test -s data/movies.json && test -s data/tv.json
          test -s data/enrichment.json && test -s data/catalog-status.json
